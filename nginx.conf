server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mismo origen para el panel y la API: sin CORS y el JWT no cruza dominios.
    location /api/ {
        # Archivos de la base de conocimiento y audio de grabaciones (webhook de ElevenLabs): el límite por
        # defecto de nginx (1 MB) los cortaría. La API aplica sus propios límites por endpoint.
        client_max_body_size 200m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servidor MCP de Wan: responde en streaming (SSE), así que sin buffer y con timeouts largos.
    location /api/mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # SignalR: WebSocket necesita el upgrade explícito y timeouts largos (la conexión queda abierta).
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve index.html para que la resuelva React Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
